<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Camera aperture">
  <!--
    PLACEHOLDER favicon. A camera aperture, drawn in the site's own palette
    (the film background and film-accent tokens) so it does not look borrowed.

    Replace it with a real mark when there is one. See docs/GETTING-STARTED.md
    Step 1b. Keep the 64x64 viewBox and re-run scripts/build-favicon.mjs, which
    regenerates favicon.ico and apple-touch-icon.png from this file.

    Kept deliberately coarse. A favicon is seen at 16x16 far more often than
    anything else, and fine detail turns to mush at that size. No double hyphen
    anywhere in this comment: it is illegal in XML and the renderer rejects the
    whole file.
  -->
  <rect width="64" height="64" rx="12" fill="#171c18" />
  <g transform="translate(32 32)">
    <!-- Blade mass: the ring of metal between the opening and the barrel. -->
    <circle r="19" fill="#b0b595" />

    <!-- The opening. A hexagon, because six blades leave six sides. -->
    <path d="M0-8.5 L7.36-4.25 L7.36 4.25 L0 8.5 L-7.36 4.25 L-7.36-4.25 Z" fill="#171c18" />

    <!--
      Blade edges. Each runs from a corner of the opening out to the barrel,
      swept 55 degrees rather than straight out, which is what gives an
      aperture its turbine look instead of a cartwheel.
    -->
    <g stroke="#171c18" stroke-width="2.2" stroke-linecap="round" fill="none">
      <path d="M0-8.5 L15.56-10.9" />
      <path d="M0-8.5 L15.56-10.9" transform="rotate(60)" />
      <path d="M0-8.5 L15.56-10.9" transform="rotate(120)" />
      <path d="M0-8.5 L15.56-10.9" transform="rotate(180)" />
      <path d="M0-8.5 L15.56-10.9" transform="rotate(240)" />
      <path d="M0-8.5 L15.56-10.9" transform="rotate(300)" />
    </g>

    <!-- Barrel. Drawn last so it trims the blade edges cleanly. -->
    <circle r="19" fill="none" stroke="#e1ded4" stroke-width="3" />
  </g>
</svg>
